[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intake-prototype"
version = "0.1.0"
description = "Safe prototype for receiving invoice PDFs by email"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "msal>=1.32,<2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.35,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1,<2",
    "azure-identity>=1.19,<2",
    "certifi>=2024",
    "psycopg[binary,pool]>=3.2,<4",
]
test = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[project.scripts]
invoice-processor = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
